sender_config:
  workers: 0 # Number of workers (threads)
  sending_mode: "host" # smtp | host | ews | oauth2 | shell | Tester&Sender |
                       # Combine modes with a pipe to enable ORDERED failover.
                       # The sender tries each mode left to right until one succeeds:
                       #   "smtp | host | ews"  -> smtp first, then host, then ews
                       #   "smtp | ews"         -> smtp first, then ews
                       # When two or more modes are active the startup banner lists them
                       # and announces "Multiple sending modes enabled".
                       # "test&send" enables a pre-campaign test phase: the dedicated
                       # test letter (test_config.subject / test_config.letter) is
                       # delivered to the leads first, then the sender waits
                       # test_config.time seconds before the main campaign starts.
                       # Combine it with a transport, e.g. "test&send | smtp".
  message_type: "html" # plain | html
  inline_images: true # Enable by changing value to true, disable by changing value to false (Some Email Providers requires inline images in place of base64 images)
  timezone: "UTC" # This will help in generating DATE|TIME macros based on the timezone you provide.
                       # v8.2: "tester" and "tester&send" are self-enabling tokens,
                       # just like smtp/host/ews/oauth2/shell - the mode is active
                       # simply because the token is present (no test_config.tester
                       # needed). "tester" runs the tester letter on the leads only;
                       # "tester&send" also runs the main campaign afterwards.
                       # Remove the token to switch the mode off.
                  # Provide valid timezone e.g "America/New_York", "Europe/London", "UTC"

# Pause config
pause_config:
  enable: false # Enable by changing value to true, disable by changing value to false
  time: 5 # Time in seconds to pause the sender
  tasks: 1 # After performing given number of tasks (attempt to send email), the sender will wait for the time specified

# Leads config
leads_config:
  target: "LEADS/leads.txt" # Location of leads 
  enable_csv: false # Enable by changing value to true, disable by changing value to false
  csv_location: "LEADS/leads.csv"  # Keep Valid email in first column and secondary data (like full name, address, phone number....) from second column onwards
# test config
                                   # Use in letter as {INFO1}, {INFO2}....

# Delete config
delete_config:
  enable: false # Enable by changing value to true, disable by changing value to false
# VDM host config (v4: direct-to-MX sending, implemented natively in send.py - no external binary needed)

# test config
test_config:
  enable: false # PERIODIC VERIFICATION TEST (v5). true => every 'after' emails a test
                # copy is sent through EACH enabled sending mode to 'email' below.
                # NOTE: this key no longer turns the tester modes on by itself.
  tester: false # TESTER MODES (v5). true => enable the tester with sending_mode
                # "tester" (Tester Mode: process the tester letter on ALL leads only,
                # then stop) or "tester&send" (Tester&Sender Mode: process the tester
                # on the leads, then run the main campaign with the same transports).
                # Explicit 'tester' always wins over 'enable'.
  email: "" # Provide a single valid email address to get test emails (periodic verification copy)
  after: 10 # After every X emails you will get a test mail.
  # Hand-edited shortcut (v5 backward compat): if you write a SECOND 'enable:' line
  # inside this section (the old "Tester&Send config" block), the FIRST value is
  # read as the periodic verification flag and the SECOND value as the tester flag.
  # Prefer the explicit 'tester:' key above.

  # --- dedicated test letter used by the "test&send" sending mode ---
  testerfromname: "{smtpfrommail}"
  subject: "tests/testersubject.html" # Own subject for the test letter (empty = reuse the normal rotating subject)
  letter: "tests/testerletter.html" # Own test letter, e.g. "LETTER/test_letter.html" (empty = reuse the main letter)
  time: 5 # Delay AFTER the test phase and BEFORE the main campaign starts (value + time_unit)
  time_unit: sec # Unit for the 'time' value: sec (seconds) or min (minutes)
  group_size: 0 # test&send v3/v6: 0 = v6 sending_limit-driven sizing: each tester owns up to its
                # sending_limit consecutive leads; unlimited testers (sending_limit -1) share the
                # remainder evenly; all-unlimited pool = classic even split. N = chunks of N leads
                # per tester (round-robin, capped by the tester's remaining sending_limit).
  pace: 1by1 # test&send v6/v8 (tester&send): how each tester interleaves test vs campaign.
             # '1by1' (default since v8) = for EVERY tester: test ONE lead, wait 'time', then
             #     send the main campaign to that same lead through the same tester SMTP, then
             #     move on to the next lead. Every SMTP works 1by1 through the leads until the
             #     run finishes; the tester no longer waits for the whole test phase to end.
             # 'group' = test ALL of a tester's leads first, then run the main campaign for that
             #     group after the 'time' wait.
             # 'auto'  = v6 legacy: the pace follows each tester's OWN sending limit (the last
             #     pipe field of its SMTP line, e.g. ...|true|100): unlimited (-1) -> 1by1,
             #     numeric (100, 200, ...) -> group; mixed pools follow their own rule.
             # Requires tester&send mode (test_config.tester: true + tester&send: true).
  skip_processed: true # test&send v7/v8 (tester&send): true (default) = never re-attempt a lead
             # that tester&send already handled IN THE CURRENT RUN. A ledger in records/
             # (test_send_tested.txt + test_send_sent.txt) records the addresses tested and the
             # addresses the main campaign processed, so another SMTP / tester - or a duplicate
             # lead line - never tries the same mailbox twice.
             # v8: the ledger is wiped at the start of every run, so a completed run NEVER makes
             # the next run say "already processed ...; skipped".
             # false = no dedupe at all (re-attempt everything). Requires tester&send mode.
  ledger_persist: false # test&send v8 (tester&send): false (default) = per-run ledger: the
             # tester&send ledger (records/test_send_tested.txt + test_send_sent.txt) is erased
             # every time a run starts, so skip_processed only dedupes inside the current run and
             # the next run always starts from a clean slate.
             # true = keep the ledger between runs (old v7 behaviour): addresses tested /
             # campaign-processed by a previous run are skipped in later runs too.
             # Requires tester&send mode.
  enable_multiple: false # each multiple SMTP pool entry becomes a tester that owns a group of leads (test + campaign)
  # v3: tester rotation follows smtp_config.selection_system (1 = Cyclic, 2-5 = Random).
  # v3: the periodic verification test (email/after) sends one copy through EACH enabled sending mode.
  # v3: test&send + host + another transport = double sending -> the sender indicates and stops.
  # --- Tester&Send config (v4/v5) ---
  tester&send: false # this is for "tester&send" mode: process the tester on the leads,
  # v8.9: the tester letter is always sent through ONE transport (the primary
  # mode) so a lead is never double-sent; the main campaign keeps the full failover chain.
                # tokens in sending_mode now enable the tester by themselves, exactly
                # like smtp/host/ews/oauth2/shell, so this key is no longer required.
                # Kept for backward compatibility; it is ignored by token activation.
             # Requires the "tester&send" token in sending_mode (self-enabling since v8.2).
              # letters ONLY. Empty (default) = tester letters keep the normal campaign
              # fromname (rotation, host fromname, profile fromname). Set a fixed name,
              # e.g. testerfromname: "Felix Support", or use the placeholder
              # {smtpfrommail} to auto-use the ACTING SMTP's from-mail (field 6 of its
              # smtp.txt line) as the tester From name. The main campaign always keeps
              # its own fromname. {EMAIL} and all other placeholders still work.
              # Requires the "tester" or "tester&send" token in sending_mode.
                     # campaign with the same transports. The "tester&send" token enables
                     # this by itself (self-enabling since v8.2); this key is legacy/
                     # optional and, when true, upgrades a plain "tester" token too.
# Delete config
                     # then the main campaign next with the same transports.
                     # Requires test_config.tester: true (or the v4 duplicate 'enable').

# VDM host config (v4: direct-to-MX sending, implemented natively in send.py - no external binary needed)
host_config:
  enable: true # Enable by changing value to true, disable by changing value to false
  port: 25 # Port used for direct MX delivery (25 is the standard SMTP server-to-server port)
  host_frommail: "{EMAIL}"
  host_fromname: "{mename}"
  force_mx: "{frmsite}-{tld}.mail.protection.outlook.com" # Optional: pin ALL deliveries to one host, e.g. "example-com.mail.protection.outlook.com"
               # Empty = resolve each recipient domain's MX via DNS (standard host mode behavior)
  force_mx_filter: false ; off by default — flip to true to skip non-EOP leads
  helo_name: "EHLO"   ; or "" # Optional EHLO/HELO name; empty = derived from the from_mail domain
  timeout: 30 # Connect/read timeout in seconds
  

# smtp config
smtp_config:
  host: "smtp.mfondo.co.za"
  port: 587
  method: "tls" # Types: tls | ssl | plain | localhost (localhost on port 25 for MTA like postfix etc.)
  username: "admin@mfondo.co.za"
  password: "le5/1!AP%Hh^#"
  from_mail: "admin@mfondo.co.za"
  dangerous: false # Make it true if smtp connection throws connection error to ignore tls certificates etc.
  sending_limit: -1 # -1 means no limit. [This is the total number of emails you want the smtp to try to send]
  retry_limit: 0 # The number of attempts before marking smtp as unusable (set it 0 to ignore it)
  retry_delay_secs: 5 # The number of seconds to wait before retrying the smtp
  enable_multiple: false # Enable by changing value to true, disable by changing value to false
  list: "SMTP/smtp.txt" # Put SMTPs in format - SMTP_HOST|SMTP_PORT|SMTP_TYPE|USERNAME|PASSWORD|FROM_MAIL|DANGEROUS|SENDING_LIMIT
                        # SMTP_TYPE: "tls" | "ssl" | "plain" | localhost
                        # If you don't want to use limit sending from smtp make the sending_limit to -1
                        # Example - smtp.example.com|587|tls|user|pass|from@example.com|false|-1
  selection_system: 1   # 1 => Cyclic | 2 => Random | 3 => SerialUntilLimitExhausted | 4 => LimitedFirstThenUnlimited | 5 => TillDeath
                        # System of selecting and using multiple SMTPs


# Source IP rotation config (rotate the local source IP used per recipient)
# Requires a server that actually owns the addresses listed in MULTIPLE/ips.txt
ip_config:
  enable: true # Enable by changing value to true, disable by changing value to false
  list: "MULTIPLE/ips.txt" # One source IP (or IP:PORT) per line; lines starting with # are ignored
                           # Public IPv4 addresses are accepted (v3); IPv6 stays loopback-only

# SOCKS5 proxies config (send through a SOCKS5 proxy instead of, or in addition to, ip_config)
proxies_config:
  enable: false # Enable by changing value to true, disable by changing value to false
  ip: "" # Single-proxy host when enable_multiple is false, e.g. "127.0.0.1"
  port: 1080 # Single-proxy port
  user: "" # Optional SOCKS5 username (leave empty when the proxy needs no auth)
  password: "" # Optional SOCKS5 password (leave empty when the proxy needs no auth)
  enable_multiple: false # Enable by changing value to true, disable by changing value to false
  proxies_list: "MULTIPLE/Proxies.txt" # Pool file when enable_multiple is true; one proxy per line:
                                        #   login:password|host:port , :|host:port or host:port
                                        # Proxy mode wins over ip_config; a WARN is printed when both are on.
                                        # Requires PySocks (installed by python3 pip.py)

