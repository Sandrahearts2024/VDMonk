# QR Code config
# Usage in PDF, letters, HTML attachments, and HTML_IMAGE/image.html:
# use {QRCODE} or {qrcode} as a standalone token; src="{QRCODE}" is also supported
qrcode_config:
  enable: true # Enable by changing value to true, disable by changing value to false
  text: "{link}" # Fill in the text the qr code will reveal when scanned.
  shape: 1 # keep it 1, or provide value between 1 and 6, (1 => Square, 2 => Circle, 3 => RoundedSquare, 4 => Vertical, 5 => Horizontal, 6 => Diamond)
  shape_color:  "" # Keep it empty, or provide a valid hex color code e.g. Black => #000000
  background_color: "" # Keep it empty, or provide a valid hex color code e.g. White => #FFFFFF
  margin: 4 # Keep it 4, or Set it between 1 and 10
  enable_custom_icon: true # Enable by changing value to true, disable by changing value to false
  icon_location: "QRCODE/mail.png" # Keep it empty, or provide location of the icon
  icon_shape: 1 # Keep it empty, or provide value between 1 and 3, (1 => Square, 2 => Circle, 3 => RoundedSquare)
  icon_background_color: "" # Keep it empty, or provide a valid hex color code e.g. White => #FFFFFF
  enable_hide_qrcode: false # Enable by changing value to true, disable by changing value to false

# HTML To Image Config
# Only usable inside main letter and eml: <img src="{HTMLIMAGE}" />
html_image_config:
  enable: false # Enable by changing value to true, disable by changing value to false
  html_location: "HTML_IMAGE/image.html" # Add your html content inside this file
  enable_multiple: true # Enable by changing value to true, disable by changing value to false
  multiple_location: "HTML_IMAGE/image1.html" # Create html file under HTML_IMAGE e.g image1.html,image2.html,image3.html e.t.c.
  screen_width: 1037 # Default screen width (adjust if necessary)
  screen_height: 922 # Default screen height (adjust if necessary)
  enable_clip: false # Enable by changing value to true, disable by changing value to false (Set it to false first to get full image, then clip)
  clip_left: 1 # To Clip the image generated - cursor position from the left
  clip_top: 1 # To Clip the image generated - cursor position from the top
  clip_width: 1024 # To Clip the image generated - cursor position till the width
  clip_height: 768 # To Clip the image generated - cursor position till the height
  scale: 2.0 # the final image quality , keep it either 1.0 , 2.0 or 3.0 ( 2.0 is recommended)
  display_width: 800 # Width shown in the email; increase this value for a larger image
  display_height: 700 # Keep proportional to display_width; 0 keeps the image ratio
  show_sample: false # Enable by changing value to true, disable by changing value to false (Note: set enable_html_image to true)
  sample_email: "recipient@mail.com" # Provide email for testing macros related to emails inside sample html image
