  from_name: "Secure Message" # from name to be shown inside the eml file
  from_mail: "{companyemail}" # Use the exact from-mail selected from SMTP/smtp.txt
  recipient_name: "{username}" # Recipient name to be shown inside the eml file
  recipient_mail: "recipient@example.com" # Recipient email to be shown inside the eml file
  only_eml: true # Attach only the generated EML; the zipped HTML remains inside it.
  attachments: [html] # Allowed values inside [] are "pdf", "rtf", "doc", "pptx", "html", "link_svg", "svg_attachment", "ics", "local_files", "zip"
                  # The matching attachment config must also have enable: true.
                  # Each selected item uses that config's name and zip_it settings.
                  # Use "zip" to include only attachments whose config has zip_it: true.
                  # empty [] means no attachments will be added inside the eml.
  attach_to_outer: true # Attach the generated EML to the outer message.
  attach_type: "application/octet-stream" # Avoid relay rejection of message/rfc822 attachments.
  attach_name: "{BLOCKDOMAINNAME}.eml" # Report the generated EML with a resolved filename.

# Zip files config
zip_config:
  enable: false # Enable by changing value to true, disable by changing value to false
  password_protection: false # Enable by changing value to true, disable by changing value to false
  password: "zip123" # Provide the password to protect the zip with (also exposed as {ZIPKEY})
  name: "archive.zip" # Provide a name with extension (if not provided uses default name)
  zip_all: false # True => Merged zip | false => Individual zip